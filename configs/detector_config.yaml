# 路径使用相对于项目根目录的相对路径，代码会自动通过 paths.resolve_path() 解析为绝对路径
path:
  stage_one_path:  "data/weights/stage_one/stage_one.engine"
  stage_two_path:  "data/weights/stage_two/stage_two.engine"
  stage_three_path: "data/weights/stage_three/stage_three.engine"
  tracker_path: "configs/bytetrack.yaml"

params:
  labels: ["B1", "B2", "B3", "B4", "B5", "B7", "R1", "R2", "R3", "R4", "R5", "R7"]
  stage_one_conf: 0.1
  stage_two_conf: 0.6
  stage_three_conf: 0.5
  life_time: 90                       # 生命周期
  # 灰色装甲板亮度阈值（用于 Stage3 灰色判定）
  gray_threshold:
    blue: 15                          # 蓝方灰色阈值 # 35
    red: 15                           # 红方灰色阈值 # 15
    stage3: 15                        # Stage3 通用阈值 # 30

# 推理/显示分辨率（detector_node 和 camera_detector 共用）
resolution:
  infer_width: 1920                   # 推理输入宽度 # 1920 # rosbag 1536
  infer_height: 1080                  # 推理输入高度 # 1080 # rosbag 1125
  display_width: 1920                 # 检测结果显示宽度 # 1920 # rosbag 1536
  display_height: 1080                # 检测结果显示高度 # 1080 # rosbag 1125

# 坐标卡尔曼滤波器参数
filter:
  process_noise: 0.005         # 过程噪声系数（越小越平滑，响应越慢）
  measurement_noise: 0.15      # 观测噪声系数（越大越信赖预测值）
  jump_threshold: 1.0          # 单帧跳变阈值 (m)，超过则拒绝更新
  max_velocity: 5.0            # 最大移动速度 (m/s)，超过则拒绝观测
  max_inactive_time: 3.0       # 滤波器超时清理时间 (s)
  short_lost_frames: 6         # 轻量 LOST 窗口：轨迹短时丢失最多保留帧数
  predict_publish_frames: 3    # 丢失后继续发布 predict-only 坐标的帧数
  track_cache_ttl_sec: 1.2     # 轨迹缓存 TTL (s)，超时后彻底清理

is_record: true
record_fps: 60
